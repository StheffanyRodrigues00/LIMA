<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    
    <form> <!--Estrutura do Formulário--> 

        <label for ="nome">Nome:</label>
        <input type="text" name="nome" placeholder="Informe seu nome"required>

        <label for ="email">E-mail</label>
        <input type="email" name="email" placeholder="Informe seu e-mail"required>

        <label for="data">Data</label>
        <input type="date" name="data"required>

        <label for="senha">senha:</label>
        <label type="password" nome="senha" placeholder="Informe sua senha"required>

        <label for="Idade">Idade</label>
        <input type="number" name="idade" placeholder="Informe sua idade"required>

        <button type="submit">Enviar</button>

    </form>

</body>
</html>
