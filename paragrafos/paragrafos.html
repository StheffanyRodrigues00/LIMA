<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <!-- Tag de parágrafos -->
     <p>Isso é um parágrafo</p>

     <!-- Strong: Importância -->
      <p>Conheça o <strong> iPhone 18</strong></p>

      <!-- em: Ênfase-->
       <p>Essemé um <em> teste em itálico</em></p>

       <!-- u:  Sublinhado-->
        <p>Exempl de <u>Texto Sublinhado</u></p>

        <!-- small: Pequeno-->
        <p>Esse é um exemplo de <small>Texto pequeno</small></p>
</body>
</html>
